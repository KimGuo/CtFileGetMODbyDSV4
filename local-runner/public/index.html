<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>城通网盘直连解析 · 本地版</title>
<style>
  :root{
    --bg:#0f1115; --panel:#171a21; --panel2:#1e222b; --line:#2a2f3a;
    --fg:#e8eaed; --dim:#9aa3b2; --accent:#6c8cff; --accent2:#8b5cf6;
    --ok:#3ddc97; --err:#ff6b6b; --warn:#ffb84d;
  }
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100vh; background:
      radial-gradient(900px 500px at 15% -10%, #1d2440 0%, transparent 60%),
      radial-gradient(700px 400px at 100% 0%, #2a1c3d 0%, transparent 55%),
      var(--bg);
    color:var(--fg);
    font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    padding:40px 20px 80px;
  }
  .wrap{max-width:820px;margin:0 auto}
  h1{font-size:22px;margin:0 0 6px;letter-spacing:.3px}
  h1 span{background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
  .sub{color:var(--dim);font-size:13px;margin-bottom:26px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:16px}
  label{display:block;font-size:12px;color:var(--dim);margin-bottom:6px;letter-spacing:.3px}
  input[type=text],input[type=password]{
    width:100%;padding:11px 13px;border-radius:9px;border:1px solid var(--line);
    background:var(--panel2);color:var(--fg);font-size:14px;outline:none;transition:border .15s
  }
  input:focus{border-color:var(--accent)}
  .row{display:flex;gap:12px;margin-bottom:14px}
  .row>div{flex:1}
  .row>div.narrow{flex:0 0 180px}
  button{
    padding:11px 22px;border-radius:9px;border:0;cursor:pointer;font-size:14px;font-weight:600;
    background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;transition:opacity .15s,transform .1s
  }
  button:hover{opacity:.9}
  button:active{transform:scale(.98)}
  button:disabled{opacity:.5;cursor:not-allowed}
  button.ghost{background:transparent;border:1px solid var(--line);color:var(--dim);font-weight:500;padding:8px 14px;font-size:12px}
  button.ghost:hover{color:var(--fg);border-color:var(--accent)}
  .actions{display:flex;align-items:center;gap:12px}
  .hint{color:var(--dim);font-size:12px}
  details.adv{margin-top:4px}
  details.adv summary{cursor:pointer;color:var(--dim);font-size:12px;list-style:none;user-select:none}
  details.adv summary::-webkit-details-marker{display:none}
  details.adv summary:before{content:"▸ ";color:var(--accent)}
  details.adv[open] summary:before{content:"▾ "}
  details.adv .card{margin-top:12px;background:var(--panel2)}
  #status{margin:18px 0;padding:12px 16px;border-radius:10px;font-size:13px;display:none}
  #status.load{display:block;background:#1b2333;border:1px solid #2c3d5c;color:#a9c2ff}
  #status.err{display:block;background:#2a1a1c;border:1px solid #5c2c2c;color:#ff9b9b;white-space:pre-wrap}
  #result{display:none}
  .file-head{display:flex;align-items:flex-start;gap:14px;margin-bottom:16px}
  .icon{width:42px;height:42px;flex:0 0 42px;border-radius:10px;background:linear-gradient(135deg,#2b3350,#3a2b50);display:grid;place-items:center;font-size:19px}
  .fname{font-size:15px;font-weight:600;word-break:break-all}
  .meta{color:var(--dim);font-size:12px;margin-top:3px}
  .badge{display:inline-block;padding:1px 7px;border-radius:5px;font-size:11px;margin-left:6px;vertical-align:1px}
  .badge.vip{background:#3a2f12;color:var(--warn);border:1px solid #5c4a1c}
  .badge.free{background:#12302a;color:var(--ok);border:1px solid #1c5c4a}
  .linkbox{display:flex;gap:10px;align-items:center;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:10px 12px}
  .linkbox input{background:transparent;border:0;padding:0;font-size:12px;font-family:ui-monospace,Consolas,monospace;color:#a9c2ff}
  pre{background:#0c0e12;border:1px solid var(--line);border-radius:9px;padding:12px;overflow:auto;max-height:320px;font-size:11.5px;line-height:1.55;margin:10px 0 0;color:#8fa4c4}
  .dbg-title{color:var(--dim);font-size:12px;margin-top:16px;cursor:pointer;user-select:none}
  code{background:#0c0e12;padding:1px 5px;border-radius:4px;font-size:12px;color:#a9c2ff}
</style>
</head>
<body>
<div class="wrap">
  <h1>城通网盘 <span>直连解析</span> · 本地版</h1>
  <div class="sub">请求由本地服务端发出，可自由设置 Referer / Cookie，不受浏览器跨域限制。</div>

  <div class="card">
    <div class="row">
      <div>
        <label>文件 ID 或分享链接</label>
        <input type="text" id="id" placeholder="例如 54168721-8439138596-e9b90e6a16a2d574 或 https://xxx.ctfile.com/f/54168721-8439138596-xxxx">
      </div>
      <div class="narrow">
        <label>访问密码（可选）</label>
        <input type="text" id="pass" placeholder="无则留空">
      </div>
    </div>

    <details class="adv">
      <summary>高级选项（Cookie / 会员 Token / Referer）</summary>
      <div class="card">
        <label>登录 Cookie（解析普通文件常需要）</label>
        <input type="password" id="cookie" placeholder="从已登录 ctfile.com 的浏览器里复制整条 Cookie">
        <div class="hint" style="margin:6px 0 14px">DevTools → Network → 任一 ctfile.com 请求 → 请求头 Cookie，整行复制。</div>
        <div class="row">
          <div>
            <label>会员 Token（可选）</label>
            <input type="text" id="token" placeholder="留空则不带">
          </div>
          <div>
            <label>Referer（可选）</label>
            <input type="text" id="ref" placeholder="默认 https://www.ctfile.com/">
          </div>
        </div>
      </div>
    </details>

    <div class="actions" style="margin-top:16px">
      <button id="go">开始解析</button>
      <span class="hint" id="tip">用的是新接口 get_down_url.php，无需登录即可解析公开文件</span>
    </div>
  </div>

  <div id="status"></div>

  <div class="card" id="result">
    <div class="file-head">
      <div class="icon">📦</div>
      <div style="min-width:0">
        <div class="fname" id="fname"></div>
        <div class="meta" id="fmeta"></div>
      </div>
    </div>
    <label>直连下载地址</label>
    <div class="linkbox">
      <input type="text" id="link" readonly>
      <button class="ghost" id="copy">复制</button>
    </div>
    <div class="actions" style="margin-top:14px">
      <button id="dl">通过本地中转下载</button>
      <a id="open" class="hint" href="#" target="_blank" rel="noopener">直接打开直链 ↗</a>
    </div>
    <div class="dbg-title" id="dbgToggle">▸ 查看接口原始返回（排查用）</div>
    <pre id="dbg" style="display:none"></pre>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
let last = null;

$('dbgToggle').onclick = () => {
  const d = $('dbg');
  const open = d.style.display === 'none';
  d.style.display = open ? 'block' : 'none';
  $('dbgToggle').textContent = (open ? '▾ ' : '▸ ') + '查看接口原始返回（排查用）';
};

function setStatus(cls, html) {
  const s = $('status');
  if (!cls) { s.style.display = 'none'; return; }
  s.className = cls;
  s.innerHTML = html;
}

$('go').onclick = async () => {
  const id = $('id').value.trim();
  if (!id) { setStatus('err', '请先填写文件 ID 或分享链接'); return; }
  $('go').disabled = true;
  $('result').style.display = 'none';
  setStatus('load', '解析中…（服务端正在请求城通接口）');

  const q = new URLSearchParams({
    id,
    pass: $('pass').value.trim(),
    token: $('token').value.trim(),
    cookie: $('cookie').value.trim(),
    ref: $('ref').value.trim()
  });

  try {
    const r = await fetch('/api/parse?' + q.toString());
    const j = await r.json();
    if (!j.success) {
      setStatus('err', '❌ ' + (j.errormsg || '解析失败'));
      if (j.need_passcode) { $('pass').focus(); $('pass').style.borderColor = '#ffb84d'; }
      return;
    }
    setStatus(null);
    last = j;
    $('fname').innerHTML = j.name + '<span class="badge free">直链已就绪</span>';
    $('fmeta').textContent = [j.size, j.time, j.total_size ? (j.total_size / 1048576).toFixed(2) + ' MB (字节)' : '', 'fid ' + j.file_id]
      .filter(Boolean).join('  ·  ');
    $('link').value = j.link;
    $('open').href = j.link;
    $('dbg').textContent = JSON.stringify(j, null, 2);
    $('result').style.display = 'block';
  } catch (e) {
    setStatus('err', '❌ 本地服务异常：' + e.message);
  } finally {
    $('go').disabled = false;
  }
};

$('copy').onclick = async () => {
  const v = $('link').value;
  try { await navigator.clipboard.writeText(v); }
  catch { $('link').select(); document.execCommand('copy'); }
  $('copy').textContent = '已复制';
  setTimeout(() => $('copy').textContent = '复制', 1200);
};

$('dl').onclick = () => {
  if (!last) return;
  const q = new URLSearchParams({
    id: $('id').value.trim(),
    pass: $('pass').value.trim(),
    cookie: $('cookie').value.trim(),
    name: last.name || ''
  });
  setStatus('load', '下载已开始（服务端按 15MB 分片、每片换新直链，规避限速）。浏览器会显示进度。');
  location.href = '/api/download?' + q.toString();
};

$('id').addEventListener('keydown', e => { if (e.key === 'Enter') $('go').click(); });
$('pass').addEventListener('keydown', e => { if (e.key === 'Enter') $('go').click(); });
</script>
</body>
</html>
